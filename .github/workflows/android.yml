      - name: Fix and normalize mipmap icons
        run: |
          set -e
          RES_DIR="native/android/app/src/main/res"
          SRC_ICON="$RES_DIR/mipmap-hdpi/ic_launcher.png"

          echo "=== BEFORE: mipmap folder contents ==="
          ls -la "$RES_DIR" || true
          echo ""
          echo "=== BEFORE: icon file info ==="
          file "$RES_DIR"/mipmap-*/ic_launcher.png 2>/dev/null || true
          echo ""

          # نصب ابزار
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick file

          # چک اینکه فایل اصلی وجود داره
          if [ ! -f "$SRC_ICON" ]; then
            echo "ERROR: source icon not found at $SRC_ICON"
            exit 1
          fi

          # اصلاح فایل اصلی
          echo "=== Converting hdpi icon ==="
          convert "$SRC_ICON" -strip -define png:color-type=6 -resize 192x192! /tmp/fixed_icon.png
          cp /tmp/fixed_icon.png "$SRC_ICON"

          # برای هر density، فایل با اندازه مناسب می‌سازیم
          declare -A SIZES
          SIZES[mdpi]=48
          SIZES[hdpi]=72
          SIZES[xhdpi]=96
          SIZES[xxhdpi]=144
          SIZES[xxxhdpi]=192

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES_DIR/mipmap-$density"
            TARGET="$RES_DIR/mipmap-$density/ic_launcher.png"
            if [ -f "$TARGET" ]; then
              convert "$TARGET" -strip -define png:color-type=6 -resize "${SIZES[$density]}x${SIZES[$density]}!" /tmp/fixed_$density.png
              cp /tmp/fixed_$density.png "$TARGET"
              echo "Fixed: mipmap-$density/ic_launcher.png (${SIZES[$density]}x${SIZES[$density]})"
            else
              convert /tmp/fixed_icon.png -strip -define png:color-type=6 -resize "${SIZES[$density]}x${SIZES[$density]}!" /tmp/fixed_$density.png
              cp /tmp/fixed_$density.png "$TARGET"
              echo "Created: mipmap-$density/ic_launcher.png (${SIZES[$density]}x${SIZES[$density]})"
            fi
          done

          # پاک کردن فایل‌های nine-patch مخفی اگه هستن
          find "$RES_DIR" -name "*.9.png" -path "*mipmap*" -delete 2>/dev/null || true

          echo ""
          echo "=== AFTER: mipmap folder contents ==="
          ls -la "$RES_DIR" | grep mipmap || true
          echo ""
          echo "=== AFTER: icon file info ==="
          file "$RES_DIR"/mipmap-*/ic_launcher.png || true
          echo ""
          echo "=== AFTER: icon dimensions ==="
          for f in "$RES_DIR"/mipmap-*/ic_launcher.png; do
            if [ -f "$f" ]; then
              identify "$f" 2>/dev/null || echo "identify failed for $f"
            fi
          done
