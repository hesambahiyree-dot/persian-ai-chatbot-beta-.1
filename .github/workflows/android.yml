name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NOVA_VERSION_CODE: "1"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build web UI
        run: npm run build

      - name: Copy web assets
        run: node scripts/prepare-android-assets.mjs

      - name: Inject bridge
        run: node scripts/inject-android-bridge.mjs

      - name: Fetch llama.cpp
        run: |
          mkdir -p native/android/third_party
          git clone https://github.com/ggml-org/llama.cpp.git native/android/third_party/llama.cpp
          cd native/android/third_party/llama.cpp
          git checkout b3821

      - name: Download Model
        run: |
          mkdir -p models
          curl -L -o models/gemma-3-4b-persian-v0.Q4_K_M.gguf \
            "https://huggingface.co/mradermacher/gemma-3-4b-persian-v0-GGUF/resolve/main/gemma-3-4b-persian-v0.Q4_K_M.gguf"

      - name: Pack OBB
        run: python3 scripts/build-model-obb.py

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > native/android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble APK
        working-directory: native/android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-apk
          path: native/android/app/build/outputs/apk/release/**/*.apk
          if-no-files-found: error

      - name: Upload OBB
        if: hashFiles('native/android/app/build/outputs/obb/**/*.obb') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-obb
          path: native/android/app/build/outputs/obb/**/*.obb
