name: Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  NOVA_VERSION_CODE: "1"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JS dependencies
        run: npm ci

      - name: Build web UI
        run: npm run build

      - name: Copy web assets into Android
        run: node scripts/prepare-android-assets.mjs

      - name: Fetch llama.cpp
        run: |
          mkdir -p native/android/third_party
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git native/android/third_party/llama.cpp

      - name: Pack model OBB if present
        run: python3 scripts/build-model-obb.py

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > native/android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble APK
        working-directory: native/android
        env:
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
          PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-apk
          path: native/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload OBB
        if: hashFiles('native/android/app/build/outputs/obb/**/*.obb') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-obb
          path: native/android/app/build/outputs/obb/**/*.obb
