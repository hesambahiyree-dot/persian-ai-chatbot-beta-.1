name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NOVA_VERSION_CODE: "1"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build web UI
        run: npm run build

      - name: Copy web assets into Android
        run: node scripts/prepare-android-assets.mjs

      - name: Fetch compatible llama.cpp
        run: |
          mkdir -p native/android/third_party
          git clone https://github.com/ggml-org/llama.cpp.git native/android/third_party/llama.cpp
          cd native/android/third_party/llama.cpp
          git checkout b3821
          echo "=== llama.cpp version ==="
          git log -1 --oneline

      - name: Download Model from Hugging Face
        run: |
          mkdir -p models
          curl -L -o models/gemma-3-4b-persian-v0.Q4_K_M.gguf \
            "https://huggingface.co/mradermacher/gemma-3-4b-persian-v0-GGUF/resolve/main/gemma-3-4b-persian-v0.Q4_K_M.gguf"

      - name: Pack model OBB
        run: python3 scripts/build-model-obb.py

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > native/android/local.properties

      - name: Fix mipmap icons
        run: |
          set -e
          RES_DIR="native/android/app/src/main/res"
          SRC_ICON="$RES_DIR/mipmap-hdpi/ic_launcher.png"
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          if [ ! -f "$SRC_ICON" ]; then
            echo "ERROR: source icon not found at $SRC_ICON"
            exit 1
          fi
          convert "$SRC_ICON" -strip -define png:color-type=6 -resize 192x192! /tmp/fixed_icon.png
          cp /tmp/fixed_icon.png "$SRC_ICON"
          declare -A SIZES
          SIZES[mdpi]=48
          SIZES[hdpi]=72
          SIZES[xhdpi]=96
          SIZES[xxhdpi]=144
          SIZES[xxxhdpi]=192
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES_DIR/mipmap-$density"
            TARGET="$RES_DIR/mipmap-$density/ic_launcher.png"
            if [ -f "$TARGET" ]; then
              convert "$TARGET" -strip -define png:color-type=6 -resize "${SIZES[$density]}x${SIZES[$density]}!" /tmp/fixed_$density.png
            else
              convert /tmp/fixed_icon.png -strip -define png:color-type=6 -resize "${SIZES[$density]}x${SIZES[$density]}!" /tmp/fixed_$density.png
            fi
            cp /tmp/fixed_$density.png "$TARGET"
            echo "OK: mipmap-$density/ic_launcher.png (${SIZES[$density]}x${SIZES[$density]})"
          done
          echo "=== Final mipmap folders ==="
          ls -la "$RES_DIR" | grep mipmap || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble APK
        working-directory: native/android
        env:
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
          PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-apk
          path: native/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload OBB
        if: hashFiles('native/android/app/build/outputs/obb/**/*.obb') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-obb
          path: native/android/app/build/outputs/obb/**/*.obb
